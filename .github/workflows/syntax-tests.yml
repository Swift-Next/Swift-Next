name: Syntax Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-tests:
    name: Sublime Text ${{ matrix.build }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        build: [stable, latest]
    steps:
      - uses: actions/checkout@v4
      - name: Static syntax validation
        run: |
          ruby utils/test_check_syntax.rb
          ruby utils/check_syntax.rb
      - uses: SublimeText/syntax-test-action@v2.5.1
        with:
          build: ${{ matrix.build }}
          package_name: Swift Next
